# Modified from rime-pinyin-simp (Apache-2.0); removed stroke reverse lookup.
schema:
  schema_id: jianhuan_pinyin
  name: 全拼
  version: "0.1"
  author:
    - Jianhuan
  description: |
    Simplified pinyin using the Apache-2.0 pinyin_simp dictionary.

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@english
    - table_translator@custom_phrase

english:
  dictionary: jianhuan_english
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 100

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - derive/^([a-z]).+$/$1/
    - derive/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/

translator:
  dictionary: jianhuan_pinyin
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

menu:
  page_size: 5

punctuator:
  full_shape:
    "," : { commit: "，" }
    "." : { commit: "。" }
    "<" : { commit: "《" }
    ">" : { commit: "》" }
    "/" : { commit: "、" }
    "?" : { commit: "？" }
    ";" : { commit: "；" }
    ":" : { commit: "：" }
    "'" : { pair: [ "‘", "’" ] }
    "\"" : { pair: [ "“", "”" ] }
    "\\" : { commit: "、" }
    "|" : { commit: "｜" }
    "`" : { commit: "·" }
    "~" : { commit: "～" }
    "!" : { commit: "！" }
    "@" : { commit: "＠" }
    "#" : { commit: "＃" }
    "%" : { commit: "％" }
    "$" : { commit: "￥" }
    "^" : { commit: "……" }
    "&" : { commit: "＆" }
    "*" : { commit: "＊" }
    "(" : { commit: "（" }
    ")" : { commit: "）" }
    "-" : { commit: "－" }
    "_" : { commit: "——" }
    "+" : { commit: "＋" }
    "=" : { commit: "＝" }
    "[" : { commit: "【" }
    "]" : { commit: "】" }
    "{" : { commit: "｛" }
    "}" : { commit: "｝" }
  half_shape:
    "," : { commit: "，" }
    "." : { commit: "。" }
    "<" : { commit: "《" }
    ">" : { commit: "》" }
    "/" : { commit: "、" }
    "?" : { commit: "？" }
    ";" : { commit: "；" }
    ":" : { commit: "：" }
    "'" : { pair: [ "‘", "’" ] }
    "\"" : { pair: [ "“", "”" ] }
    "\\" : { commit: "、" }
    "|" : { commit: "｜" }
    "`" : { commit: "·" }
    "~" : { commit: "～" }
    "!" : { commit: "！" }
    "@" : { commit: "@" }
    "#" : { commit: "#" }
    "%" : { commit: "%" }
    "$" : { commit: "￥" }
    "^" : { commit: "……" }
    "&" : { commit: "&" }
    "*" : { commit: "*" }
    "(" : { commit: "（" }
    ")" : { commit: "）" }
    "-" : { commit: "-" }
    "_" : { commit: "——" }
    "+" : { commit: "+" }
    "=" : { commit: "=" }
    "[" : { commit: "【" }
    "]" : { commit: "】" }
    "{" : { commit: "{" }
    "}" : { commit: "}" }

recognizer:
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"